# Backend CI — Node.js 24 (target Azure runtime) verification.
#
# - Runs the full backend Jest suite on the ACTUAL target runtime (Node 24),
#   not the developer workstation runtime.
# - Builds the backend Docker image (backend/Dockerfile, Node 24) to prove
#   the container definition is valid.
# - The image is NEVER pushed to a registry and NEVER deployed by this
#   workflow. No cloud credentials or secrets are used or required.
name: Backend CI (Node 24)

on:
  push:
    branches: [main, master]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

jobs:
  test-node-24:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Syntax check (backend)
        working-directory: backend
        run: find src scripts tests -name '*.js' -exec node --check {} +
      - name: Run backend test suite (Node 24)
        working-directory: backend
        run: npm test
        env:
          CI: 'true'

  docker-build:
    runs-on: ubuntu-latest
    needs: test-node-24
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend image (no push, no deploy)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: campushub-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
